<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 600' width='100%' height='100%'>
  <rect width='600' height='600' fill='#fbf8f3'/>
  <!-- 6 Lobed flower placemat -->
  <g transform='translate(300,300)'>
    <!-- 6 Petals -->
    <g fill='#f0e4d0' stroke='#b58957' stroke-width='7' stroke-linejoin='round'>
      <path d='M0,-40 C-80,-140 -120,-240 0,-260 C120,-240 80,-140 0,-40 Z'/>
      <path d='M0,-40 C-80,-140 -120,-240 0,-260 C120,-240 80,-140 0,-40 Z' transform='rotate(60)'/>
      <path d='M0,-40 C-80,-140 -120,-240 0,-260 C120,-240 80,-140 0,-40 Z' transform='rotate(120)'/>
      <path d='M0,-40 C-80,-140 -120,-240 0,-260 C120,-240 80,-140 0,-40 Z' transform='rotate(180)'/>
      <path d='M0,-40 C-80,-140 -120,-240 0,-260 C120,-240 80,-140 0,-40 Z' transform='rotate(240)'/>
      <path d='M0,-40 C-80,-140 -120,-240 0,-260 C120,-240 80,-140 0,-40 Z' transform='rotate(300)'/>
    </g>
    <!-- Internal cord arabesques inside petals -->
    <g fill='none' stroke='#b58957' stroke-width='5'>
      <path d='M0,-80 C-40,-130 -60,-190 -20,-220 C10,-240 40,-200 0,-150'/>
      <path d='M0,-80 C-40,-130 -60,-190 -20,-220 C10,-240 40,-200 0,-150' transform='rotate(60)'/>
      <path d='M0,-80 C-40,-130 -60,-190 -20,-220 C10,-240 40,-200 0,-150' transform='rotate(120)'/>
      <path d='M0,-80 C-40,-130 -60,-190 -20,-220 C10,-240 40,-200 0,-150' transform='rotate(180)'/>
      <path d='M0,-80 C-40,-130 -60,-190 -20,-220 C10,-240 40,-200 0,-150' transform='rotate(240)'/>
      <path d='M0,-80 C-40,-130 -60,-190 -20,-220 C10,-240 40,-200 0,-150' transform='rotate(300)'/>
    </g>
    <!-- Center spiral in rope -->
    <circle cx='0' cy='0' r='45' fill='#d8bc92' stroke='#8c6239' stroke-width='6'/>
    <path d='M-30,0 A30,30 0 0,1 30,0 A20,20 0 0,1 -10,0 A10,10 0 0,1 5,0' fill='none' stroke='#8c6239' stroke-width='4'/>
  </g>
  <text x='300' y='575' font-family='sans-serif' font-size='16' font-weight='bold' fill='#8c6239' text-anchor='middle'>MOLDE #07 • FLOR IMPERIAL EM CORDA</text>
</svg>