<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 600' width='100%' height='100%'>
  <defs>
    <radialGradient id='wood' cx='50%' cy='50%' r='70%'>
      <stop offset='0%' stop-color='#f5ede4'/>
      <stop offset='100%' stop-color='#e5d5c5'/>
    </radialGradient>
    <pattern id='jute' width='16' height='16' patternUnits='userSpaceOnUse'>
      <rect width='16' height='16' fill='#d8be9b'/>
      <path d='M0 8h16M8 0v16' stroke='#c8ab84' stroke-width='1.5'/>
    </pattern>
    <filter id='shadow' x='-10%' y='-10%' width='120%' height='120%'>
