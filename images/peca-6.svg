<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 600' width='100%' height='100%'>
  <!-- Wooden dining table -->
  <rect width='600' height='600' fill='#c89d70'/>
  <!-- Wood grain lines -->
  <path d='M0 120h600M0 240h600M0 360h600M0 480h600' stroke='#b78759' stroke-width='2' opacity='0.5'/>
  <!-- Center table runner with brown cord arabesques -->
  <rect x='190' y='0' width='220' height='600' fill='#f1e7d8' stroke='#8b5a2b' stroke-width='4'/>
  <g stroke='#683d16' stroke-width='4' fill='none'>
    <path d='M230,50 C280,20 320,80 370,50 C330,120 270,120 230,190 C290,190 320,250 370,230'/>
    <path d='M230,280 C280,250 320,310 370,280 C330,350 270,350 230,420 C290,420 320,480 370,460'/>
    <circle cx='300' cy='150' r='18' fill='#8b5a2b'/>
    <circle cx='300' cy='380' r='18' fill='#8b5a2b'/>
  </g>
  <!-- Left daisy placemat -->
  <ellipse cx='105' cy='300' rx='90' ry='140' fill='#f4ece1' stroke='#8b5a2b' stroke-width='4'/>
  <circle cx='105' cy='230' r='12' fill='#ffffff' stroke='#ffd54f' stroke-width='5'/>
  <circle cx='105' cy='370' r='12' fill='#ffffff' stroke='#ffd54f' stroke-width='5'/>
  <!-- Right daisy placemat -->
  <ellipse cx='495' cy='300' rx='90' ry='140' fill='#f4ece1' stroke='#8b5a2b' stroke-width='4'/>
  <circle cx='495' cy='230' r='12' fill='#ffffff' stroke='#ffd54f' stroke-width='5'/>
  <circle cx='495' cy='370' r='12' fill='#ffffff' stroke='#ffd54f' stroke-width='5'/>
  <!-- Ceramic vase with greenery -->
  <circle cx='300' cy='300' r='38' fill='#e2dbd1' stroke='#8b5a2b' stroke-width='2'/>
  <path d='M300,280 Q280,240 260,230 M300,280 Q320,240 340,230 M300,270 V220' stroke='#3e6b48' stroke-width='4' stroke-linecap='round'/>
  <text x='300' y='575' font-family='sans-serif' font-size='16' font-weight='bold' fill='#5c3513' text-anchor='middle'>MOLDE #44 • TRILHO ARABESCO & MARGARIDAS</text>
</svg>